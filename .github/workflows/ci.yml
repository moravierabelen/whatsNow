name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, so its pnpm store cache can find pnpm on PATH.
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same four commands the README documents, in the same order, so
      # "it passes locally" and "it passes in CI" cannot drift apart.
      # No API keys are needed: the providers are mocked in tests, and the
      # build only inlines VITE_* values when they exist.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
